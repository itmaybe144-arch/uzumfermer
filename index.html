<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Опросник Uzumfermer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
body{margin:0}
/* Layout: a single printed questionnaire sheet on a grey desk; numbered fields, ruled answer lines, answers appear in ballpoint blue. One deliberate light look. */
:root{
  --desk:#EFEFED; --paper:#FFFFFF; --ink:#141414; --soft:#5E5E5A; --rule:#141414; --hair:#C9C9C3;
  --pen:#141414; --stamp:#E3241B; --fill:#F6F6F4; --grey:#8C8C8C;
  --sans:"Inter",-apple-system,"Segoe UI",Arial,sans-serif; --narrow:var(--sans); --mono:var(--sans);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--desk)}
body{color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:28px 120px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

.sheet{max-width:780px;margin:0 auto;background:var(--paper);border:1px solid #CFCFC9;padding:44px 52px 48px}
@media (max-width:600px){body{padding-inline:0;padding-top:0}.sheet{border:0;padding:24px 18px 36px}}

/* header block */
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end;border-bottom:1px solid var(--hair);padding-bottom:22px}
.hd .org{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.hd .org b{color:var(--stamp);font-weight:600}
.hd h1{font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1.05;letter-spacing:-.02em;margin:26px 0 0}
.hd h1 span{display:block;color:var(--grey)}
.hd .no{font-size:13px;font-variant-numeric:tabular-nums;text-align:right;color:var(--soft);line-height:1.7}
.hd .no b{font-weight:400;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 26px;padding:12px 0;border-bottom:1px solid var(--hair);font-size:15px}
.meta .lbl{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:500;color:var(--soft);margin-right:8px}
.intro{padding:24px 0 6px;max-width:60ch;font-size:19px;line-height:1.5}
.intro p{margin:0 0 10px}
.intro .how{font-size:15px;color:var(--soft)}

/* sections */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:10px}
.sec-h .let{font-size:13px;color:var(--grey);font-variant-numeric:tabular-nums;flex:none}
.sec-h h2{font-weight:400;font-size:30px;letter-spacing:-.015em;margin:0}
.sec-note{font-size:15px;color:var(--soft);margin:8px 0 0;max-width:62ch}

.q{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 10px;padding:18px 0 16px;border-bottom:1px solid var(--hair)}
.q .n{font-size:13px;color:var(--grey);padding-top:4px;font-variant-numeric:tabular-nums}
.q .t{font-weight:500;margin:0 0 4px}
.q .t .req{font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--stamp);margin-left:6px;white-space:nowrap}
.q .h{font-size:14px;color:var(--soft);margin:0 0 8px}
.q .multi{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 6px}
@media (max-width:600px){.q{grid-template-columns:34px minmax(0,1fr)}}

.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 18px;margin-top:6px}
.bx{position:relative;display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;min-height:36px}
.bx input{position:absolute;opacity:0;width:22px;height:22px;margin:0;cursor:pointer}
.bx .sq{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);margin-top:2px;position:relative;background:var(--paper)}
.bx input:checked + .sq::before,.bx input:checked + .sq::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:2.4px;background:var(--stamp);border-radius:2px}
.bx input:checked + .sq::before{transform:translate(-50%,-50%) rotate(45deg)}
.bx input:checked + .sq::after{transform:translate(-50%,-50%) rotate(-45deg)}
.bx input:checked ~ .lb{color:var(--ink);font-weight:500}
.bx input:focus-visible + .sq{outline:2px solid var(--pen);outline-offset:2px}

.line{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:6px 2px 4px;font-size:18px;color:var(--pen);border-radius:0}
.line:focus{outline:none;border-bottom-color:var(--stamp);background:var(--fill)}
.ruled{width:100%;border:0;resize:vertical;min-height:112px;padding:0 2px;font-size:18px;line-height:32px;color:var(--pen);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--ink) 31px,var(--ink) 32px);background-attachment:local;border-radius:0}
.ruled:focus{outline:none;background-color:var(--fill)}
.oth{display:flex;gap:10px;align-items:baseline;margin-top:6px}
.oth span{font-size:15px;color:var(--soft);white-space:nowrap}
.err{color:var(--stamp);font-size:14px;margin:6px 0 0}

/* end block */
.end{margin-top:44px;border-top:1px solid var(--ink);padding-top:18px;display:grid;gap:14px}
.end h2{font-weight:400;font-size:30px;letter-spacing:-.015em;margin:0}
.end p{margin:0;max-width:62ch}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.b{border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:14px 22px;gap:10px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.b.o{background:transparent;color:var(--ink);border-color:transparent;padding-inline:4px}
.b::after{content:"\2192"}
.b:active{transform:translateY(1px)}
.note{font-size:14px;color:var(--soft);min-height:20px}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;transform:rotate(-4deg);font-size:20px;opacity:.9}
details summary{cursor:pointer;font-size:15px;color:var(--soft);min-height:32px}
pre.out{white-space:pre-wrap;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--fill);padding:14px;max-height:380px;overflow:auto;margin:6px 0 0}

/* bottom strip */
.strip{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink);color:#fff;z-index:5}
.strip-in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.strip .bar{flex:1;height:4px;background:#444;max-width:260px}
.strip .bar i{display:block;height:100%;background:var(--stamp);width:0;transition:width .3s}
.strip a{color:#fff;text-decoration:none}
.langs{display:inline-flex;gap:14px}
.langs .bx{padding:0;min-height:0}

/* answers tab */
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
th{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:500;color:var(--soft);border-bottom:1px solid var(--ink)}
td.num{font-variant-numeric:tabular-nums;color:var(--grey);white-space:nowrap}
.lk{border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 2px;font-size:15px}
.tabs{display:flex;gap:22px;justify-content:flex-end;max-width:780px;margin:0 auto 10px;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:500}
.tabs button{border:0;background:none;padding:4px 0;cursor:pointer;color:var(--soft)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom:1px solid var(--stamp)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>


</head><body>
<nav id="tabs" hidden><button type="button" data-view="form"></button><button type="button" data-view="admin"></button></nav>

   {id:"tenure",t:"single",l:S("Сколько вы работаете в Uzumfermer?","Uzumfermerda qancha vaqtdan beri ishlaysiz?"),o:O(

   {id:"contact",t:"text",l:S("Telegram или телефон для уточнений","Aniqlashtirish uchun Telegram yoki telefon")}

   {id:"l_where",t:"multi",other:1,l:S("Где вы ведёте заявку, пока клиент не приехал?","Mijoz kelguncha arizani qayerda yuritasiz?"),o:O(

const L = o => o ? (o[st.lang] || o.ru) : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const roleKey = () => { const i = ROLES.findIndex(r => r.ru === st.a.role); return i < 0 ? null : ROLE_KEYS[i]; };
const secsFor = rk => SECTIONS.filter(s => s.roles === "*" || (rk && s.roles.includes(rk)));
function hasAns(id){ const v = st.a[id]; return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim()); }
let saveT = null;
function saveDraft(){ clearTimeout(saveT); saveT = setTimeout(() => { try{ localStorage.setItem(DKEY, JSON.stringify({a:st.a, lang:st.lang, no:st.no})); }catch(e){} }, 300); }
const today = () => { const d = new Date(); return [d.getDate(), d.getMonth()+1, d.getFullYear()].map(x => String(x).padStart(2,"0")).join("."); };

/* ---------- record / text ---------- */
function buildRecord(){
  const ans = {};
  secsFor(roleKey()).forEach(s => s.q.forEach(q => { if(hasAns(q.id)) ans[q.id] = st.a[q.id]; const o = st.a[q.id+"__other"]; if(o && o.trim()) ans[q.id+"__other"] = o.trim(); }));
  return {v:3, no:st.no, name:(st.a.name||"").trim(), role:roleKey(), lang:st.lang, ts:new Date().toISOString(), answers:ans};
}
function recordText(rec, lang){
  const lg = lang || "ru", LL = o => o[lg] || o.ru, out = [];
  let n = 0;
  secsFor(rec.role).forEach(s => {
    const lines = [];
    s.q.forEach(q => {
      n++;
      if(rec.answers[q.id] === undefined && !rec.answers[q.id+"__other"]) return;
      let v = rec.answers[q.id];
      if(q.o){ const tr = x => { const o = q.o.find(o => o.ru === x); return o ? LL(o) : x; }; v = Array.isArray(v) ? v.map(tr).join(", ") : (v ? tr(v) : ""); }
      const oth = rec.answers[q.id+"__other"]; if(oth) v = (v ? v + ", " : "") + oth;
      lines.push(`${String(n).padStart(2,"0")}. ${LL(q.l)}\n    ${v}`);
    });
    if(lines.length){ out.push(LL(s.t).toUpperCase()); out.push(...lines); out.push(""); }
  });
  return out.join("\n");
}
function b64(s){ const b = new TextEncoder().encode(s); let bin = ""; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); }
function unb64(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
const head = rec => `${rec.lang==="uz"?"So'rovnoma":"Анкета"} №${rec.no} · Uzumfermer · ${rec.name}`;
const payload = rec => head(rec) + "\n\n" + recordText(rec, rec.lang) + "\nUZF1:" + b64(JSON.stringify(rec));
function tgHref(rec){
  const body = "\n\n" + recordText(rec, rec.lang) + "\nUZF1:" + b64(JSON.stringify(rec));
  const full = "https://t.me/share/url?url=" + encodeURIComponent(head(rec)) + "&text=" + encodeURIComponent(body);
  if(full.length < 7000) return full;
  return "https://t.me/share/url?url=" + encodeURIComponent(head(rec)) + "&text=" + encodeURIComponent(rec.lang==="uz" ? "\nJavoblar nusxalandi, shu yerga qo'ying." : "\nОтветы скопированы, вставьте их сюда.");
}

/* ---------- render ---------- */
function field(q, n){
  const t = T(), v = st.a[q.id];
  const req = q.req ? `<span class="req">* ${t.req}</span>` : "";
  const err = st.tried && q.req && !hasAns(q.id) ? `<p class="err" role="alert">${t.need}</p>` : "";
  let body;
  if(q.t === "text") body = `<input class="line" type="text" id="f_${q.id}" data-q="${q.id}" value="${esc(v||"")}" autocomplete="${q.id==="name"?"name":"off"}" aria-labelledby="t_${q.id}">`;
  else if(q.t === "area") body = `<textarea class="ruled" id="f_${q.id}" data-q="${q.id}" rows="3" aria-labelledby="t_${q.id}">${esc(v||"")}</textarea>`;
  else {
    const multi = q.t === "multi";
    body = (multi ? `<p class="multi">${t.multi}</p>` : "") + `<div class="boxes" role="${multi?"group":"radiogroup"}" aria-labelledby="t_${q.id}">${q.o.map((o,i) => {
      const on = multi ? (Array.isArray(v) && v.includes(o.ru)) : v === o.ru;
      return `<label class="bx"><input type="${multi?"checkbox":"radio"}" name="f_${q.id}" data-q="${q.id}" data-kind="${q.t}" value="${esc(o.ru)}"${on?" checked":""}><span class="sq"></span><span class="lb">${esc(L(o))}</span></label>`;
    }).join("")}</div>` + (q.other ? `<div class="oth"><span>${t.other}</span><input class="line" type="text" data-q="${q.id}__other" value="${esc(st.a[q.id+"__other"]||"")}" aria-label="${t.other}"></div>` : "");
  }
  return `<div class="q" id="q_${q.id}"><div class="n">${String(n).padStart(2,"0")}</div><div><p class="t" id="t_${q.id}">${esc(L(q.l))}${req}</p>${q.h ? `<p class="h">${esc(L(q.h))}</p>` : ""}${body}${err}</div></div>`;
}
function formHTML(){
  const t = T(), secs = secsFor(roleKey());
  let n = 0;
  const sections = secs.map((s, si) => `<section class="sec" aria-labelledby="s_${s.id}">
      <div class="sec-h"><span class="let">${String(si+1).padStart(2,"0")}</span><h2 id="s_${s.id}">${esc(L(s.t))}</h2></div>
      <p class="sec-note">${esc(L(s.sub))}</p>
      ${s.q.map(q => field(q, ++n)).join("")}</section>`).join("");
  const ok = hasAns("name") && roleKey(), rec = buildRecord();
  const end = `<section class="end" id="send"><h2>${t.endH}</h2>
      ${st.saved ? `<p><span class="stamp">${t.sent}</span></p><p>${t.thanks}</p>` : ok ? `<p>${t.endP}</p>
        <div class="btns"><button type="button" class="b" id="sendBtn"${st.sending?" disabled":""}>${st.sending ? t.sending : t.sendBtn}</button></div>
        <p class="note" id="note" role="status" style="color:var(--stamp)">${esc(st.note)}</p>` : `<p class="err" style="font-size:16px">${t.endNeed}</p>`}
      ${st.saved ? `<p><button type="button" class="lk" id="againBtn">${t.again}</button></p>` : ""}</section>`;
  return `<header class="hd"><div><div class="org"><b>Pro</b>motion · Media &amp; marketing agency</div><h1>${t.title}<span>${t.for}</span></h1></div>
      <div class="no">${t.no} <b>${st.no}</b><br>${t.date} <b>${today()}</b></div></header>
    <div class="meta"><span><span class="lbl">${t.lang}</span><span class="langs">
      <label class="bx"><input type="radio" name="lng" data-lang="ru"${st.lang==="ru"?" checked":""}><span class="sq"></span><span class="lb">Русский</span></label>
      <label class="bx"><input type="radio" name="lng" data-lang="uz"${st.lang==="uz"?" checked":""}><span class="sq"></span><span class="lb">O'zbekcha</span></label></span></span></div>
    <div class="intro"><p>${t.p1}</p><p>${t.p2}</p><p class="how">${t.how}</p></div>
    ${sections}${end}`;
}
function roleLabel(rk){ const i = ROLE_KEYS.indexOf(rk); return i < 0 ? "?" : L(ROLES[i]); }

const LINK = "https://claude.ai/artifact/VyABNjyMrZLUxNwbxXymDJ";
const INVITE = {
  ru:"Здравствуйте! Это агентство Promotion. По просьбе Дмитрия собираем короткую анкету для всех, кто общается с гостями Uzumfermer: заявки, звонки, переписка. Займёт около 10 минут, можно с телефона.\n\nАнкета: " + LINK + "\n\nВ конце нажмите «Отправить в Telegram» и перешлите ответ мне. Спасибо!",
  uz:"Assalomu alaykum! Bu Promotion agentligi. Dmitriyning iltimosiga ko'ra Uzumfermer mehmonlari bilan muloqot qiladigan barcha xodimlar uchun qisqa so'rovnoma yig'yapmiz: arizalar, qo'ng'iroqlar, yozishma. Taxminan 10 daqiqa oladi, telefondan ham bo'ladi.\n\nSo'rovnoma: " + LINK + "\n\nOxirida «Telegramga yuborish» tugmasini bosing va javobni menga yuboring. Rahmat!"
};
const norm = x => String(x||"").toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\s]/gu," ").split(/\s+/).filter(Boolean);
function matchName(line, name){ const a = norm(line), b = norm(name); if(!a.length || !b.length) return false; return a.every(w => b.includes(w)) || b.every(w => a.includes(w)); }
let roster = [], rosterDoc = null;
function adminHTML(){
  const a = T().adm;
  const hd = `<header class="hd"><div><div class="org">Promotion · Uzumfermer</div><h1>${a.h}</h1></div><div class="no">${rows.length} / ${roster.length || "?"}</div></header><div class="intro"><p>${a.sub}</p></div>`;
  if(!db) return hd + `<p>${a.nodb}</p>`;
  const body = rows.length ? `<div class="tbl"><table><thead><tr><th>№</th><th>${a.name}</th><th>${a.role}</th><th>${a.date}</th><th>${a.src}</th><th></th></tr></thead><tbody>${rows.map(r => `<tr>
      <td class="num">${esc(r.d.no||"")}</td><td>${esc(r.d.name)}</td><td>${esc(roleLabel(r.d.role))}</td><td class="num">${esc((r.d.ts||"").slice(0,10))}</td><td>${r.d.src==="paste"?a.tg:a.form}</td>
      <td style="white-space:nowrap"><button type="button" class="lk" data-open="${r.id}">${st.openRow===r.id?a.hide:a.open}</button>
      ${st.confirmDel===r.id ? `<button type="button" class="lk" style="color:var(--stamp)" data-delok="${r.id}">${a.sure}</button><button type="button" class="lk" data-delno="1">${a.no}</button>` : `<button type="button" class="lk" data-del="${r.id}">${a.del}</button>`}</td></tr>
      ${st.openRow===r.id ? `<tr><td colspan="6"><pre class="out">${esc(recordText(r.d, st.lang))}</pre></td></tr>` : ""}`).join("")}</tbody></table></div>`
    : `<p style="color:var(--soft)">${rowsReady ? a.empty : "…"}</p>`;
  const tg = lg => "https://t.me/share/url?url=" + encodeURIComponent(LINK) + "&text=" + encodeURIComponent("\n" + INVITE[lg].replace("\n\n" + (lg==="uz"?"So'rovnoma: ":"Анкета: ") + LINK, ""));
  const invite = `<section class="sec"><div class="sec-h"><h2>${a.t1}</h2></div><p class="sec-note">${a.inviteP}</p>
    ${["ru","uz"].map(lg => `<div class="q" style="grid-template-columns:minmax(0,1fr)"><div><p class="t">${lg==="ru"?a.inviteRu:a.inviteUz}</p><pre class="out" id="inv_${lg}">${esc(INVITE[lg])}</pre>
      <div class="btns" style="margin-top:10px"><a class="b" href="${esc(tg(lg))}" target="_blank" rel="noopener">${a.sendInv}</a><button type="button" class="b o" data-copyinv="${lg}">${a.copyInv}</button></div></div></div>`).join("")}
    <p class="note" id="invNote" role="status"></p></section>`;
  const matched = new Set();
  const rl = roster.map(n => { const r = rows.find(r => matchName(n, r.d.name)); if(r) matched.add(r.id); return {n, r}; });
  const extra = rows.filter(r => !matched.has(r.id));
  const got = rl.filter(x => x.r).length;
  const track = `<section class="sec"><div class="sec-h"><h2>${a.t2}</h2></div>
    ${roster.length ? `<p class="sec-note" style="font-family:var(--mono);color:var(--ink)">${a.progress(got, roster.length)}</p>
      <div class="tbl"><table><tbody>${rl.map((x,i) => `<tr><td class="num" style="width:44px">${String(i+1).padStart(2,"0")}</td><td>${esc(x.n)}</td>
        <td>${x.r ? `<span style="color:var(--pen)">${esc(roleLabel(x.r.d.role))}</span>` : ""}</td>
        <td style="text-align:right">${x.r ? `<span class="stamp" style="font-size:13px;padding:2px 8px;border-width:2px">${a.got}</span>` : `<span style="font-family:var(--mono);color:var(--soft)">${a.wait}</span>`}</td></tr>`).join("")}</tbody></table></div>
      ${extra.length ? `<p class="sec-note">${a.notInList}: ${extra.map(r => esc(r.d.name)).join(", ")}</p>` : ""}`
    : `<p class="sec-note">${a.noRoster}</p>`}
    <div class="q" style="grid-template-columns:minmax(0,1fr);border:0"><div><p class="t">${a.rosterP}</p>
      <textarea class="ruled" id="rosterBox" rows="6" aria-label="${a.rosterP}">${esc(roster.join("\n"))}</textarea>
      <div class="btns" style="margin-top:10px"><button type="button" class="b o" id="rosterSave">${a.rosterSave}</button></div><p class="note" id="rosterNote" role="status"></p></div></div></section>`;
  return hd + invite + track + `<section class="sec"><div class="sec-h"><h2>${a.t3}</h2></div>` + body + `</section><section class="end"><h2>${a.paste}</h2><textarea class="ruled" id="pasteBox" rows="5" aria-label="${a.paste}"></textarea>
    <div class="btns"><button type="button" class="b" id="addBtn">${a.add}</button>${dl && rows.length ? `<button type="button" class="b o" id="csvBtn">${a.csv}</button>` : ""}</div><p class="note" role="status">${esc(st.admMsg)}</p></section>`;
}
function updateStrip(){
  const t = T(), strip = document.getElementById("strip");
  if(st.view === "admin"){ strip.hidden = true; return; }
  strip.hidden = false;
  const qs = secsFor(roleKey()).flatMap(s => s.q), a = qs.filter(q => hasAns(q.id) || (st.a[q.id+"__other"]||"").trim()).length;
  document.getElementById("stripTxt").textContent = t.filled(a, qs.length);
  document.getElementById("stripBar").style.width = Math.round(a / qs.length * 100) + "%";
  document.getElementById("stripGo").textContent = t.toEnd;
}
function refreshEnd(){
  const end = document.getElementById("send"); if(!end) return;
  const tmp = document.createElement("div"); tmp.innerHTML = formHTML();
  const fresh = tmp.querySelector("#send"); const open = end.querySelector("details")?.open;
  end.replaceWith(fresh); if(open){ const d = fresh.querySelector("details"); if(d) d.open = true; }
}
function render(){
  document.documentElement.lang = st.lang;
  const tabs = document.getElementById("tabs"); tabs.hidden = !isOwner;
  tabs.querySelector('[data-view="form"]').textContent = st.lang === "uz" ? "So'rovnoma" : "Анкета";
  tabs.querySelector('[data-view="admin"]').textContent = st.lang === "uz" ? "Javoblar" : "Ответы";
  tabs.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === st.view)));
  document.getElementById("app").innerHTML = st.view === "admin" && isOwner ? adminHTML() : formHTML();
  updateStrip();
}

/* ---------- events ---------- */
const app = document.getElementById("app");
let endT = null;
app.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.lang){ st.lang = el.dataset.lang; saveDraft(); render(); return; }
  const id = el.dataset.q; if(!id) return;
  if(el.dataset.kind === "multi") st.a[id] = [...app.querySelectorAll(`input[name="f_${id}"]:checked`)].map(x => x.value);
  else if(el.dataset.kind === "single"){
    const prev = roleKey(); st.a[id] = el.value;
    if(id === "role" && prev !== roleKey()){ saveDraft(); const y = scrollY; render(); scrollTo(0, y); return; }
  } else st.a[id] = el.value;
  st.sent = false; st.note = "";
  saveDraft(); updateStrip();
  clearTimeout(endT); endT = setTimeout(refreshEnd, 250);
});
app.addEventListener("click", async e => {
  const el = e.target.closest("button, a"); if(!el) return;
  if(el.id === "sendBtn"){
    if(st.sending) return; st.sending = true; st.note = ""; refreshEnd();
    try{
      await sendEncrypted({...buildRecord(), ts:new Date().toISOString()});
      st.saved = true; try{ localStorage.removeItem(DKEY); }catch(e){}
    }catch(err){ st.note = T().fail; }
    st.sending = false; refreshEnd(); document.getElementById("send").scrollIntoView({behavior:"smooth", block:"center"}); return;
  }
  if(el.id === "fileBtn"){ const r = buildRecord(); try{ await dl.save({filename:`uzumfermer-anketa-${r.no}.txt`, data:payload(r)}); }catch(err){} return; }
  if(el.id === "againBtn"){ st.a = {}; st.no = String(Math.floor(1000 + Math.random()*9000)); st.sent = st.saved = false; st.note = ""; saveDraft(); render(); scrollTo(0,0); return; }
  if(el.dataset.open){ st.openRow = st.openRow === el.dataset.open ? null : el.dataset.open; render(); return; }
  if(el.dataset.del){ st.confirmDel = el.dataset.del; render(); return; }
  if(el.dataset.delno){ st.confirmDel = null; render(); return; }
  if(el.dataset.delok){ try{ await db.doc("responses/" + el.dataset.delok).delete(); }catch(err){} st.confirmDel = null; render(); return; }
  if(el.dataset.copyinv){ try{ await navigator.clipboard.writeText(INVITE[el.dataset.copyinv]); document.getElementById("invNote").textContent = T().adm.invCopied; }catch(err){ const r = document.createRange(); r.selectNodeContents(document.getElementById("inv_" + el.dataset.copyinv)); getSelection().removeAllRanges(); getSelection().addRange(r); } return; }
  if(el.id === "rosterSave"){
    const list = document.getElementById("rosterBox").value.split("\n").map(x => x.trim()).filter(Boolean);
    try{ await db.doc("config/roster").set({names:list, ts:new Date().toISOString()}); roster = list; render(); const n = document.getElementById("rosterNote"); if(n) n.textContent = T().adm.rosterSaved; }catch(err){ const n = document.getElementById("rosterNote"); if(n) n.textContent = (err && err.message) || "error"; }
    return;
  }
  if(el.id === "addBtn"){
    const raw = document.getElementById("pasteBox").value, m = raw.match(/UZF1:\s*([A-Za-z0-9+/=\s]+)/);
    let rec = null; try{ rec = m && JSON.parse(unb64(m[1].replace(/\s+/g,""))); }catch(err){}
    if(!rec || !rec.answers){ st.admMsg = T().adm.bad; render(); return; }
    try{ await db.collection("responses").add({...rec, src:"paste"}); st.admMsg = T().adm.added; }catch(err){ st.admMsg = (err && err.message) || "error"; }
    render(); return;
  }
  if(el.id === "csvBtn"){
    const qs = SECTIONS.flatMap(s => s.q.filter(q => !["name","role"].includes(q.id)));
    const cell = x => `"${String(x ?? "").replace(/"/g,'""')}"`;
    const hd = ["№","Имя","Должность","Дата","Источник", ...qs.map(q => q.l.ru)];
    const lines = [hd.map(cell).join(";")].concat(rows.map(r => [r.d.no, r.d.name, roleLabel(r.d.role), (r.d.ts||"").slice(0,10), r.d.src, ...qs.map(q => {
      let v = r.d.answers[q.id]; v = Array.isArray(v) ? v.join(", ") : (v||""); const o = r.d.answers[q.id+"__other"]; return o ? (v ? v + ", " : "") + o : v; })].map(cell).join(";")));
    try{ await dl.save({filename:"uzumfermer-ankety.csv", data:"﻿" + lines.join("\r\n")}); }catch(err){}
  }
});
document.getElementById("stripGo").addEventListener("click", e => {
  e.preventDefault();
  if(!(hasAns("name") && roleKey())){ st.tried = true; render(); document.getElementById("q_name").scrollIntoView({behavior:"smooth", block:"center"}); return; }
  document.getElementById("send").scrollIntoView({behavior:"smooth"});
});
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { st.view = b.dataset.view; render(); }));

render();
</script>

</body></html>
